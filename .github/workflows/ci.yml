# @cpt-algo:cpt-studio-spec-init-structure-change-infrastructure:p1
name: CI

# `release/**` alongside `main`: a release is stabilised on a branch and only then
# tagged, so that branch is the last thing tested before a version goes out.
# Filtering CI to `main` meant the one branch whose whole purpose is being tested
# before a tag was the one branch this pipeline never ran on -- the v1.7.0 release
# PR showed only the checks that come from apps (DCO, SonarCloud, code-ranker), and
# no tests, lint, coverage or artifact validation.
#
# Deliberately says nothing about where the branch is cut from. CONTRIBUTING.md
# says `main`; `release/v1.7.0` was in fact cut at the `v1.6.2` tag, which is why
# it never reached `main`. #257 settles that in CONTRIBUTING's favour, and this
# trigger is correct either way -- which is the reason not to restate the
# procedure here and give it a second place to drift (#211, #254 review).
#
# Two patterns because the repository has two naming habits. CONTRIBUTING.md
# documents `git checkout -b vX.Y.Z-beta`, which `v[0-9]*` covers; what was
# actually cut for the last release was `release/v1.7.0` and
# `release/v1.7.0-integration`, which `release/**` covers. Matching only one of
# them would leave the other untested, which is the state this change exists to
# end -- so both are matched until the convention is settled one way.
on:
  push:
    branches: [main, 'release/**', 'v[0-9]*']
  pull_request:
    branches: [main, 'release/**', 'v[0-9]*']

# Keyed on `github.ref`, which keeps a push run and a pull-request run in separate
# groups -- deliberately, and after trying the opposite.
#
# Admitting release branches to `push` means a branch with an open PR into `main`
# matches both events per commit, and a first attempt at this collapsed them into
# one group so the second would cancel the first. That was wrong: the two runs do
# not test the same commit. The push run tests the branch head; the pull-request
# run tests `refs/pull/N/merge`, which is what `main` would become. Sharing a group
# lets a push cancel the merge-result run, which is the more valuable of the two
# and the one the release branch exists to earn (#254 review).
#
# So a release branch with an open PR does cost two runs per commit. That is the
# price of testing both the branch and the merge result, not duplicated work.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    permissions:
      # Same reasoning as `gates` below: this job runs pull-request code, so it gets
      # the least privilege that still lets it check out and read.
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # `make install` and `make test` execute pull-request code -- a contributed
          # conftest.py runs before any assertion does -- so the job token stays out of
          # .git/config here for exactly the reason it does in `gates`. Applying it to
          # one of the two jobs and not the other left the larger one unprotected.
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: make install

      - name: Run tests
        run: make test

  # Surfaces the enforcement corpus as its own check. The `test` job already
  # runs these assertions, but a green suite of ~4,700 tests is not evidence
  # that a gate can fail -- and a gate that never fails is worthless. This job
  # makes the red direction visible in the pipeline: known-bad fixtures must be
  # rejected, known-good fixtures must stay clean.
  #
  # "Must" here is the corpus's contract, not the pipeline's: this repository has no
  # branch protection and no rulesets, so no check in this file -- this one included --
  # blocks a merge on its own. A red `gates` is a signal a reviewer has to act on. To
  # make it binding, register "Enforcement Gates (seeded violations must fail)" as a
  # required status check on `main`; until then, treat this comment as the honest
  # description of what a failure here does and does not prevent.
  gates:
    name: Enforcement Gates (seeded violations must fail)
    runs-on: ubuntu-latest
    permissions:
      # This job runs pull-request code (`make install`, `make test-gates`), so
      # it gets the least privilege that still lets it check out and read.
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Keep the job token out of .git/config so the test corpus this job
          # executes cannot read it back. The initial fetch is unaffected.
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: make install

      - name: Known-bad must be red, known-good must stay green
        run: make test-gates

  coverage:
    name: Coverage (≥90%)
    runs-on: ubuntu-latest
    permissions:
      # Runs the same `make install` + test suite over pull-request code as `test`.
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install test dependencies
        run: make install

      - name: Run tests with coverage
        run: make test-coverage

      - name: Upload coverage report
        if: always() && !env.ACT
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            htmlcov/
            coverage.json
            coverage.xml
          retention-days: 14

  sonarqube:
    name: SonarQube
    needs: coverage
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download coverage report
        if: env.SONAR_TOKEN != ''
        uses: actions/download-artifact@v4
        with:
          name: coverage-report

      - name: SonarQube Scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v6

  pylint:
    name: Pylint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run pylint
        run: make pylint

  vulture:
    name: Dead Code Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run vulture
        run: make vulture-ci

  versions:
    name: Version Consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check version consistency
        run: make check-versions

  declared-stops:
    name: Declared Stops (no rise)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Walks the repository's own workflows/ and skills/, so it needs no generated
      # bootstrap and no released kit -- both of which are absent here by design.
      - name: Check declared stops against the baseline
        run: make declared-stops

  spec-coverage:
    name: Spec Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Repair bootstrap
        run: make bootstrap-repair

      - name: Check spec coverage
        run: make spec-coverage

  validate:
    name: Validate Artifacts (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Repair bootstrap
        run: make bootstrap-repair

      - name: Validate core methodology
        run: make CFS="python3 .bootstrap/.core/skills/studio/scripts/studio.py" validate

      - name: Self-check SDLC examples
        run: make CFS="python3 .bootstrap/.core/skills/studio/scripts/studio.py" self-check

  validate-kits:
    name: Validate Kits (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Repair bootstrap
        run: make bootstrap-repair

      - name: Validate all registered kits
        run: make CFS="python3 .bootstrap/.core/skills/studio/scripts/studio.py" validate-kits
