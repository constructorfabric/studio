# @cpt-algo:cpt-studio-spec-init-structure-change-infrastructure:p1
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: make install

      - name: Run tests
        run: make test

  # Surfaces the enforcement corpus as its own check. The `test` job already
  # runs these assertions, but a green suite of ~4,700 tests is not evidence
  # that a gate can fail -- and a gate that never fails is worthless. This job
  # makes the red direction visible in the pipeline: known-bad fixtures must be
  # rejected, known-good fixtures must stay clean.
  gates:
    name: Enforcement Gates (seeded violations must fail)
    runs-on: ubuntu-latest
    permissions:
      # This job runs pull-request code (`make install`, `make test-gates`), so
      # it gets the least privilege that still lets it check out and read.
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Keep the job token out of .git/config so the test corpus this job
          # executes cannot read it back. The initial fetch is unaffected.
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: make install

      - name: Known-bad must be red, known-good must stay green
        run: make test-gates

  coverage:
    name: Coverage (≥90%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install test dependencies
        run: make install

      - name: Run tests with coverage
        run: make test-coverage

      - name: Upload coverage report
        if: always() && !env.ACT
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            htmlcov/
            coverage.json
            coverage.xml
          retention-days: 14

  sonarqube:
    name: SonarQube
    needs: coverage
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download coverage report
        if: env.SONAR_TOKEN != ''
        uses: actions/download-artifact@v4
        with:
          name: coverage-report

      - name: SonarQube Scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v6

  pylint:
    name: Pylint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run pylint
        run: make pylint

  vulture:
    name: Dead Code Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run vulture
        run: make vulture-ci

  versions:
    name: Version Consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check version consistency
        run: make check-versions

  spec-coverage:
    name: Spec Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Repair bootstrap
        run: make bootstrap-repair

      - name: Check spec coverage
        run: make spec-coverage

  validate:
    name: Validate Artifacts (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Repair bootstrap
        run: make bootstrap-repair

      - name: Validate core methodology
        run: make CFS="python3 .bootstrap/.core/skills/studio/scripts/studio.py" validate

      - name: Self-check SDLC examples
        run: make CFS="python3 .bootstrap/.core/skills/studio/scripts/studio.py" self-check

  validate-kits:
    name: Validate Kits (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Repair bootstrap
        run: make bootstrap-repair

      - name: Validate all registered kits
        run: make CFS="python3 .bootstrap/.core/skills/studio/scripts/studio.py" validate-kits
