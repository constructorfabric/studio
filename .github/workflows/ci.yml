# @cpt-algo:cpt-studio-spec-init-structure-change-infrastructure:p1
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Every job here reads the repository and writes nothing back: no release, no comment,
# no tag. Declared once at workflow level so a job added later inherits least privilege
# instead of the repository default, which is the way this gap opened in the first place
# (#229 review).
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    permissions:
      # Same reasoning as `gates` below: this job runs pull-request code, so it gets
      # the least privilege that still lets it check out and read.
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0
          # `make install` and `make test` execute pull-request code -- a contributed
          # conftest.py runs before any assertion does -- so the job token stays out of
          # .git/config here for exactly the reason it does in `gates`. Applying it to
          # one of the two jobs and not the other left the larger one unprotected.
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: make install

      - name: Run tests
        run: make test

  # Surfaces the enforcement corpus as its own check. The `test` job already
  # runs these assertions, but a green suite of ~4,700 tests is not evidence
  # that a gate can fail -- and a gate that never fails is worthless. This job
  # makes the red direction visible in the pipeline: known-bad fixtures must be
  # rejected, known-good fixtures must stay clean.
  #
  # "Must" here is the corpus's contract, not the pipeline's: this repository has no
  # branch protection and no rulesets, so no check in this file -- this one included --
  # blocks a merge on its own. A red `gates` is a signal a reviewer has to act on. To
  # make it binding, register "Enforcement Gates (seeded violations must fail)" as a
  # required status check on `main`; until then, treat this comment as the honest
  # description of what a failure here does and does not prevent.
  gates:
    name: Enforcement Gates (seeded violations must fail)
    runs-on: ubuntu-latest
    permissions:
      # This job runs pull-request code (`make install`, `make test-gates`), so
      # it gets the least privilege that still lets it check out and read.
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0
          # Keep the job token out of .git/config so the test corpus this job
          # executes cannot read it back. The initial fetch is unaffected.
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: make install

      - name: Known-bad must be red, known-good must stay green
        run: make test-gates

  coverage:
    name: Coverage (≥90%)
    runs-on: ubuntu-latest
    permissions:
      # Runs the same `make install` + test suite over pull-request code as `test`.
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.14'

      - name: Install test dependencies
        run: make install

      - name: Run tests with coverage
        run: make test-coverage

      - name: Upload coverage report
        if: always() && !env.ACT
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: coverage-report
          path: |
            htmlcov/
            coverage.json
            coverage.xml
          retention-days: 14

  sonarqube:
    name: SonarQube
    needs: coverage
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Download coverage report
        if: env.SONAR_TOKEN != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: coverage-report

      - name: SonarQube Scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602  # v6.0.0

  pylint:
    name: Pylint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'

      - name: Run pylint
        run: make pylint

  vulture:
    name: Dead Code Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'

      - name: Run vulture
        run: make vulture-ci

  versions:
    name: Version Consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'

      - name: Check version consistency
        run: make check-versions

  spec-coverage:
    name: Spec Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'

      - name: Repair bootstrap
        run: make bootstrap-repair

      - name: Check spec coverage
        run: make spec-coverage

  validate:
    name: Validate Artifacts (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Repair bootstrap
        run: make bootstrap-repair

      - name: Validate core methodology
        run: make CFS="python3 .bootstrap/.core/skills/studio/scripts/studio.py" validate

      - name: Self-check SDLC examples
        run: make CFS="python3 .bootstrap/.core/skills/studio/scripts/studio.py" self-check

  validate-kits:
    name: Validate Kits (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Repair bootstrap
        run: make bootstrap-repair

      - name: Validate all registered kits
        run: make CFS="python3 .bootstrap/.core/skills/studio/scripts/studio.py" validate-kits
