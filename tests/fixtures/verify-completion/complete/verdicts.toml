phase = 1
item = "`step-1.out` exists in the run directory"
verdict = "satisfied"
evidence = "step-1.out present, 42 bytes"

[[verdicts]]
phase = 1
item = "`step-1.out` names the phase it came from"
verdict = "satisfied"
evidence = "first line reads 'phase 1'"

[[verdicts]]
phase = 1
item = "the run recorded a verdict for every criterion above"
verdict = "satisfied"
